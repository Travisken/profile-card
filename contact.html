<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact-Travis</title>
    <link rel="stylesheet" href="contact-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
    <section>
        <div class="sect left">

            <div class="left-pgh">
                <span class="span-txt">
                    Reach out for consultation
                </span>
                <p class="left-head-pgh">
                    <strong class="span-head">
                        Discuss
                    </strong>
                    your Technical Solutions and software needs
                </p>

                <p class="left-sub-pgh">
                    Are you looking a top-quality software developer tailored to your needs? reach out to me.
                </p>

                <div class="contacts">
                    <div class="contact-info mail-card">
                        <i class="fa-solid fa-envelope"></i>
                        <div>
                            <p>E-mail</p>
                            <p class="contact-mail">
                                kentravis37@gmail.com
                            </p>
                        </div>

                    </div>


                    <div class="contact-info mail-card">
                        <i class="fa-solid fa-phone"></i>
                        <div>
                            <p>Phone number</p>
                            <p class="contact-phone">
                                +234 7039444495
                            </p>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <div class="sect right">
            <form action="">
                <div>
                    <label for="name">
                        Name
                    </label>
                    <input type="text" placeholder=" Full Name" id="name" name="name">
                </div>


                <div>
                    <label for="Email">
                        Email
                    </label>
                    <input type="text" placeholder="Email" id="Email" name="Email">
                </div>

                <div>
                    <label for="Industry">
                        Industry
                    </label>
                    <input type="text" placeholder="Industry" id="Industry" name="Industry">
                </div>


                <div>
                    <label for="message">
                        Message
                    </label>
                    <textarea placeholder="Message" id="message" name="message">
                </div>

                <button class="contact-btn"> 
                    Get in contact
                </button>
            </form>
        </div>

    </section>
</body>

</html>
